# CI: make check (go test ./... + gofmt + go vet), cross-build every
# goreleaser target, and the dogfood self-check on this repository's own
# go.mod (PRD-0000 Req 13, DoD).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Test, vet, dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make check (go test ./... + gofmt + go vet)
        run: make check
      - name: dogfood — resolve this repository's own go.mod
        run: go run . list --file-path main.go

  cross-build:
    name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null .
